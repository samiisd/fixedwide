<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="fixedwide">
  <title>fixedwide</title>
  <desc>Three values of increasing width, pierced by one decimal point that never moves.</desc>
  <defs>
    <linearGradient id="fw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#7A45E8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#fw-bg)"/>

  <!-- 64, 128, 256 bits: the value widens in both directions... -->
  <g fill="#FFFFFF">
    <rect x="42" y="27" width="44" height="16" rx="8" opacity="0.55"/>
    <rect x="29" y="56" width="70" height="16" rx="8" opacity="0.78"/>
    <rect x="16" y="85" width="96" height="16" rx="8"/>
  </g>

  <!-- ...and the decimal point does not. Same x, every row. -->
  <rect x="59" y="20" width="10" height="88" rx="5" fill="#FFC53D"/>
</svg>
