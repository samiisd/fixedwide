name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A superseded run tells you nothing, so do not pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every platform README.md claims is built and RUN here. A configuration that
# does not appear in this file must be reported as not-configured in
# reports/EXECUTION_MATRIX.csv, never as supported.
#
# On the Clang rows: Clang 17 and 18 report __cpp_concepts as 201907, and
# libstdc++ gates <expected> on 202002, so those compilers cannot see
# std::expected with the system standard library at all -- this library will not
# compile there. They are paired with libc++, which has no such gate. That was
# measured, not assumed; see docs/ci.md.
jobs:
  linux:
    name: linux ${{ matrix.toolchain.name }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: gcc-14
            packages: g++-14
            cmake_args: -DCMAKE_CXX_COMPILER=g++-14
          - name: clang-18-libc++
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            cmake_args: >-
              -DCMAKE_CXX_COMPILER=clang++-18
              -DCMAKE_CXX_FLAGS=-stdlib=libc++
              -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
        build_type: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.toolchain.packages }} libboost-dev cmake ninja-build
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.toolchain.cmake_args }} \
            -DFIXEDWIDE_BUILD_TESTS=ON \
            -DFIXEDWIDE_BUILD_EXAMPLES=ON \
            -DFIXEDWIDE_BUILD_ORACLE_TESTS=ON
      - run: cmake --build build
      # Examples are ctest tests, so this is also the check that every example
      # in the README still compiles and still prints the right answer.
      - run: ctest --test-dir build --output-on-failure

  linux-arm64:
    name: linux arm64 ${{ matrix.cxx }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++-14 ]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 libboost-dev cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON \
            -DFIXEDWIDE_BUILD_ORACLE_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  macos:
    name: macos ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-14, macos-15 ]
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja boost
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON \
            -DFIXEDWIDE_BUILD_ORACLE_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: windows ${{ matrix.toolset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolset: [ msvc, clang-cl ]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # MSVC has no __int128 and no GNU inline asm, so it takes the portable
      # multi-limb backend automatically. Boost is not installed: the two
      # Boost-backed audit suites skip themselves and the rest still run.
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.toolset == 'clang-cl' && '-DCMAKE_CXX_COMPILER=clang-cl' || '' }}
          -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  portable-backend:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: forced-portable
            flags: -DFIXEDWIDE_FORCE_PORTABLE=ON
          - name: no-int128
            flags: -DFIXEDWIDE_FORCE_PORTABLE=ON "-DCMAKE_CXX_FLAGS=-U__SIZEOF_INT128__"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 libboost-dev cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON \
            ${{ matrix.config.flags }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan+ubsan ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [ native, portable ]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 libc++-18-dev libc++abi-18-dev libboost-dev cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
            -DFIXEDWIDE_SANITIZE=ON -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON \
            ${{ matrix.backend == 'portable' && '-DFIXEDWIDE_FORCE_PORTABLE=ON' || '' }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  shared-library:
    name: shared library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 libboost-dev cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_CXX_COMPILER=g++-14 -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  packaging:
    name: install + find_package consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build
      - name: Build and install
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DFIXEDWIDE_BUILD_TESTS=OFF -DFIXEDWIDE_BUILD_EXAMPLES=OFF
          cmake --build build --target install
      # The consumer sees nothing but the install tree: if the exported package
      # is wrong, this is where it shows.
      - name: Consume it
        run: |
          cmake -S examples/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage" \
            -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build-consumer
          ./build-consumer/consumer

  conan:
    name: conan create
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install "conan>=2.4"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build
      # The runner's default c++ is g++-13, so `conan profile detect` would
      # describe one compiler while CMake used another. Name it explicitly --
      # and g++-13 genuinely cannot build this: libstdc++ did not put frexpl in
      # namespace std until GCC 14.
      - run: conan profile detect --force
      - name: conan create
        env: { CC: gcc-14, CXX: g++-14 }
        # test_package links the package and checks the number it prints, so a
        # recipe that packages nothing usable fails here rather than downstream.
        run: conan create . --build=missing -s compiler.cppstd=23 -s compiler.version=14
      - name: The portable backend must package too
        env: { CC: gcc-14, CXX: g++-14 }
        run: conan create . --build=missing -s compiler.cppstd=23 -s compiler.version=14 -o "&:force_portable=True"

  benchmark:
    name: instruction-count regression gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build valgrind
      # Deterministic: the gate counts retired instructions under Valgrind, not
      # wall-clock, because a shared runner's timing noise is larger than the
      # regression worth catching. See docs/benchmarks.md.
      - name: Measure
        env: { CXX: g++-14 }
        run: |
          cmake -B build_icount -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DFIXEDWIDE_BUILD_BENCHMARKS=ON \
            -DFIXEDWIDE_BUILD_TESTS=OFF -DFIXEDWIDE_BUILD_EXAMPLES=OFF
          cmake --build build_icount --target fixedwide_icount
          ./scripts/icount.sh --binary build_icount/benchmarks/fixedwide_icount > current.csv
          cat current.csv
      - name: Compare against the committed baseline
        run: python3 scripts/compare_icount.py benchmarks/baseline/x86_64-gcc-14.csv current.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instruction-counts
          path: current.csv

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Clang 20 with libstdc++, not Clang 18 with libc++: the libFuzzer runtime
      # Ubuntu ships is built against libstdc++, so linking it into a libc++
      # binary leaves std::thread and std::string undefined. Clang 20 reports
      # __cpp_concepts=202002, so libstdc++ gives it <expected> and no second
      # standard library is needed.
      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DFIXEDWIDE_SANITIZE=ON -DFIXEDWIDE_BUILD_FUZZER=ON \
            -DFIXEDWIDE_BUILD_TESTS=OFF -DFIXEDWIDE_BUILD_EXAMPLES=OFF
          cmake --build build --target fixedwide_fuzz
      # Short on a pull request; the nightly workflow runs it for much longer.
      - run: ./build/fuzz/fixedwide_fuzz fuzz/corpus -max_total_time=90 -print_final_stats=1

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Clang 20 with libstdc++, for the same reason as the fuzz job: one
      # standard library, and llvm-cov from the matching release.
      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends libboost-dev cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DFIXEDWIDE_COVERAGE=ON -DFIXEDWIDE_BUILD_TESTS=ON -DFIXEDWIDE_BUILD_EXAMPLES=ON
          cmake --build build
      - name: Run tests and report coverage
        run: |
          mkdir -p "$PWD/profraw"
          # An absolute pattern: ctest runs each test from its own binary
          # directory, so a relative one scatters the files and the merge finds
          # nothing.
          LLVM_PROFILE_FILE="$PWD/profraw/%p.profraw" ctest --test-dir build --output-on-failure
          llvm-profdata-20 merge -sparse profraw/*.profraw -o merged.profdata
          objects=$(find build/tests build/examples -maxdepth 1 -type f -perm -u+x \
                    | sed 's/^/-object /' | tr '\n' ' ')
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          llvm-cov-20 report $objects -instr-profile=merged.profdata \
            "$PWD/src" "$PWD/include" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
