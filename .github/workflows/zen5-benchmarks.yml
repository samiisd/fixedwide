name: Zen 5 SIMD Benchmarks

# This personal workstation runs only manually reviewed repository branches.
# Never add pull_request/pull_request_target or fork-controlled checkout inputs.
on:
  workflow_dispatch:
    inputs:
      ccd:
        description: 'L3 group (one discovered core); all is unpinned diagnostic only'
        required: true
        default: 'vcache'
        type: choice
        options: ['vcache', 'frequency', 'all']
      compiler:
        description: 'Compiler'
        required: true
        default: 'clang'
        type: choice
        options: ['clang', 'gcc']
      extra_flags:
        description: 'CXX flags; use -O3 -march=znver5 for a separate machine-specific run'
        required: false
        default: '-O3 -march=x86-64'
        type: string
      benchmark_filter:
        description: 'Google Benchmark filter (empty selections fail)'
        required: false
        default: '.*'
        type: string
      repetitions:
        description: 'Repetitions (1-30); baseline comparisons alternate revision order'
        required: false
        default: '5'
        type: string
      min_time:
        description: 'Minimum time per case, in seconds (e.g. 0.2s)'
        required: false
        default: '0.2s'
        type: string
      baseline_sha:
        description: 'Optional exact 40-digit SHA reachable from main; blank compares candidate backends only'
        required: false
        default: ''
        type: string
      suite:
        description: 'Benchmark executable'
        required: true
        default: 'batch'
        type: choice
        options: ['batch', 'runtime', 'zen5']

permissions:
  contents: read

# Share this group with any other workflow that uses the workstation for timing.
# This serializes Actions jobs, but cannot reserve a core from local workloads.
concurrency:
  group: fixedwide-ryzen-9950x3d-measurements
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'samiisd/fixedwide' && github.ref_type == 'branch'
    name: zen5 (${{ inputs.ccd }}, ${{ inputs.compiler }}, ${{ inputs.suite }})
    runs-on: [self-hosted, ryzen-9950x3d]
    timeout-minutes: 180
    env:
      ZEN5_CCD: ${{ inputs.ccd }}
      ZEN5_COMPILER: ${{ inputs.compiler }}
      ZEN5_FLAGS: ${{ inputs.extra_flags }}
      ZEN5_FILTER: ${{ inputs.benchmark_filter }}
      ZEN5_REPETITIONS: ${{ inputs.repetitions }}
      ZEN5_MIN_TIME: ${{ inputs.min_time }}
      ZEN5_BASELINE_SHA: ${{ inputs.baseline_sha }}
      ZEN5_SUITE: ${{ inputs.suite }}
      ZEN5_OUTPUT: ${{ runner.temp }}/fixedwide-zen5-results-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test measurement controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_zen5_bench.py
      - name: Build, validate, stabilize and measure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zen5_bench.py
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zen5-${{ inputs.ccd }}-${{ inputs.compiler }}-${{ inputs.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ env.ZEN5_OUTPUT }}/
