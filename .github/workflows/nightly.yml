name: Nightly

# Long-running correctness checks that are too slow for each pull request.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.minutes }} minutes
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        minutes: [ 30 ]
    steps:
      - uses: actions/checkout@v7
      # See .github/workflows/ci.yml: the shipped libFuzzer runtime is built
      # against libstdc++, so the fuzzer needs a Clang that can use libstdc++.
      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DFIXEDWIDE_SANITIZE=ON -DFIXEDWIDE_BUILD_FUZZER=ON \
            -DFIXEDWIDE_BUILD_TESTS=OFF -DFIXEDWIDE_BUILD_EXAMPLES=OFF
          cmake --build build --target fixedwide_fuzz
      - run: ./build/fuzz/fixedwide_fuzz fuzz/corpus -max_total_time=$(( ${{ matrix.minutes }} * 60 )) -print_final_stats=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
