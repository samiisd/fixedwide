name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 libboost-dev cmake ninja-build unzip zip
      # scripts/release.sh builds the archive with `git archive`, so it contains
      # exactly what is committed, then proves it by extracting it elsewhere and
      # verifying the manifest inside the extracted tree. Do not reimplement it
      # here: the script is the thing that is tested locally.
      - name: Build and verify the archive
        # scripts/release.sh exports the tracked tree into a staging directory,
        # generates the manifest from what is actually staged, zips it, and then
        # verifies and builds a fresh extraction. Every check in it is fatal.
        run: ./scripts/release.sh
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The zip, its checksum and the verification log are three separate
          # assets. None of them lives inside the archive, so nothing describes
          # itself and no asset can be stale relative to another.
          # awk, not a sed range: `sed -n '/^## \[/,/^## \[/p'` restarts after
          # each range and so emitted every OTHER section too -- 295 lines
          # covering four releases instead of the one being tagged.
          awk '/^## \[/{if(n++)exit} n' CHANGELOG.md > /tmp/release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            dist/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-assets
          path: dist/
