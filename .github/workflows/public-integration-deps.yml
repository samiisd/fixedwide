name: Public integration dependency bundle
on:
  push:
    branches: [ci/public-integration-deps-20260907]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2d242ae998e15e5495572870ddd38208b572daf2
          persist-credentials: false
      - name: Bundle pinned public source dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/sources bundle/debs
          curl -fL --retry 3 https://codeload.github.com/martinus/unordered_dense/tar.gz/refs/tags/v4.9.2 -o bundle/sources/unordered_dense.tar.gz
          curl -fL --retry 3 https://codeload.github.com/cameron314/concurrentqueue/tar.gz/refs/tags/v1.0.5 -o bundle/sources/concurrentqueue.tar.gz
          curl -fL --retry 3 https://codeload.github.com/stephenberry/glaze/tar.gz/refs/tags/v8.3.0 -o bundle/sources/glaze.tar.gz
          curl -fL --retry 3 https://codeload.github.com/google/googletest/tar.gz/refs/tags/v1.18.0 -o bundle/sources/googletest.tar.gz
          curl -fL --retry 3 https://codeload.github.com/google/benchmark/tar.gz/refs/tags/v1.9.5 -o bundle/sources/benchmark.tar.gz
          git archive HEAD | gzip -n > bundle/sources/fixedwide.tar.gz
      - name: Download Debian toolchain packages without application sources
        run: |
          docker run --rm -v "$PWD/bundle/debs:/out" debian:trixie bash -ec '
            apt-get update -qq
            cd /out
            apt-get download clang-19 libclang-cpp19 libllvm19 libclang-common-19-dev libclang-rt-19-dev libclang1-19 llvm-19-linker-tools clang-tidy-19 clang-format-19 libasio-dev libedit2 libxml2 libz3-4 valgrind libc6-dbg
          '
      - name: Record bundle integrity
        run: |
          cd bundle
          find sources debs -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: public-integration-dependencies
          path: bundle/
          retention-days: 3
          compression-level: 0
