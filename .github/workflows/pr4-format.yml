name: PR 4 one-shot formatting

on:
  push:
    branches: [ benchmarks-and-docs-revamp ]

permissions:
  contents: write

concurrency:
  group: pr4-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: benchmarks-and-docs-revamp
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install "clang-format==22.1.8"
      - name: Apply the repository formatter
        run: ./scripts/format.sh
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/competitor
          git commit -m "style: format competitor benchmark"
          git push origin HEAD:benchmarks-and-docs-revamp
