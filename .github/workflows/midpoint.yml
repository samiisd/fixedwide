name: Midpoint benchmarks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'include/fixedwide/**'
      - 'src/**'
      - 'tests/test_midpoint.cpp'
      - 'tests/audit_midpoint.cpp'
      - 'tests/coverage_support.hpp'
      - 'benchmarks/midpoint_bench.cpp'
      - 'benchmarks/measurement.hpp'
      - 'benchmarks/CMakeLists.txt'
      - '.github/workflows/midpoint.yml'

permissions:
  contents: read

concurrency:
  group: midpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        portable: [ 'OFF', 'ON' ]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install compiler and oracle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14 libboost-dev cmake ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DFIXEDWIDE_BUILD_TESTS=ON \
            -DFIXEDWIDE_BUILD_EXAMPLES=OFF -DFIXEDWIDE_BUILD_BENCHMARKS=ON \
            -DFIXEDWIDE_FORCE_PORTABLE=${{ matrix.portable }}
          cmake --build build --target test_midpoint audit_midpoint fixedwide_midpoint_bench
      - name: Verify and measure
        run: |
          mkdir -p midpoint-results
          ctest --test-dir build -R midpoint --output-on-failure | tee midpoint-results/tests.log
          ./build/benchmarks/fixedwide_midpoint_bench 262144 7 \
            > midpoint-results/timing.csv 2> midpoint-results/validation.log
      - name: Retain reproduction inputs
        if: always()
        run: |
          mkdir -p midpoint-results
          git archive --format=tar.gz HEAD > midpoint-results/source.tar.gz
          { git rev-parse HEAD; g++-14 --version; uname -a; lscpu; } > midpoint-results/environment.txt
          cp build/compile_commands.json midpoint-results/
          sha256sum build/benchmarks/fixedwide_midpoint_bench build/libfixedwide.a \
            > midpoint-results/binaries.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: midpoint-portable-${{ matrix.portable }}
          path: midpoint-results/
          if-no-files-found: error
